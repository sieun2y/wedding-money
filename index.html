<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>축의대 관리</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans KR",
        sans-serif;
      background: #f7f5f2;
      color: #333;
      padding-bottom: 82px;
    }

    button,
    input,
    textarea {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    .container {
      width: 100%;
      max-width: 620px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 32px 18px 30px;
    }

    .header {
      text-align: center;
      margin-bottom: 26px;
    }

    .header .icon {
      font-size: 40px;
      margin-bottom: 8px;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
    }

    .header p {
      margin: 8px 0 0;
      color: #888;
      font-size: 14px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 22px;
      margin-bottom: 16px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.05);
    }

    .label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 9px;
    }

    .side-buttons {
      display: flex;
      gap: 9px;
      margin-bottom: 20px;
    }

    .side-button {
      flex: 1;
      border: 1px solid #ddd;
      background: white;
      border-radius: 12px;
      padding: 12px;
      font-size: 15px;
    }

    .side-button.active {
      background: #333;
      color: white;
      border-color: #333;
    }

    .envelope-number-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f7f5f2;
      border-radius: 12px;
      padding: 11px 14px;
      margin-bottom: 20px;
    }

    .envelope-number-box span {
      color: #888;
      font-size: 13px;
    }

    .envelope-number-box strong {
      font-size: 20px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 11px;
      font-size: 16px;
      outline: none;
      margin-bottom: 17px;
      background: white;
    }

    input:focus,
    textarea:focus {
      border-color: #888;
    }

    textarea {
      width: 100%;
      height: 48px;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 11px;
      font-size: 16px;
      outline: none;
      resize: none;
      margin-bottom: 17px;
      background: white;
    }

    .amount-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      margin-bottom: 11px;
    }

    .amount-button {
      padding: 10px 4px;
      border: 1px solid #ddd;
      background: white;
      border-radius: 9px;
      font-size: 14px;
    }

    .amount-button:active {
      background: #f1f1f1;
    }

    .submit-button {
      width: 100%;
      border: none;
      border-radius: 13px;
      padding: 15px;
      background: #222;
      color: white;
      font-size: 17px;
      font-weight: 600;
    }

    .submit-button:disabled {
      background: #aaa;
      cursor: wait;
    }

    .status {
      text-align: center;
      margin-top: 14px;
      font-size: 14px;
      min-height: 20px;
      word-break: break-word;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .summary-box {
      background: white;
      border-radius: 15px;
      padding: 15px 8px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.04);
    }

    .summary-box .number {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .summary-box .title {
      font-size: 11px;
      color: #999;
    }

    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .list-header h2 {
      margin: 0;
      font-size: 19px;
    }

    .refresh-button {
      border: 1px solid #ddd;
      background: white;
      border-radius: 9px;
      padding: 7px 11px;
      font-size: 12px;
    }

    .search {
      margin-bottom: 12px;
    }

    .filter-buttons {
      display: flex;
      gap: 7px;
      margin-bottom: 15px;
    }

    .filter-button {
      border: 1px solid #ddd;
      background: white;
      border-radius: 9px;
      padding: 8px 13px;
      font-size: 13px;
    }

    .filter-button.active {
      background: #333;
      color: white;
      border-color: #333;
    }

    .record {
      border-top: 1px solid #eee;
      padding: 14px 0;
    }

    .record:first-child {
      border-top: none;
    }

    .record-main {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .record-name {
      font-weight: 700;
      font-size: 16px;
    }

    .record-amount {
      font-weight: 700;
      font-size: 16px;
      white-space: nowrap;
    }

    .record-info {
      display: flex;
      gap: 8px;
      margin-top: 6px;
      color: #888;
      font-size: 12px;
      flex-wrap: wrap;
    }

    .badge {
      padding: 3px 7px;
      border-radius: 6px;
      background: #f1f1f1;
    }

    .memo-text {
      margin-top: 8px;
      padding: 9px 10px;
      background: #fafafa;
      border-radius: 8px;
      color: #777;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .delete-button {
      border: 1px solid #eee;
      background: #fff;
      color: #999;
      border-radius: 8px;
      padding: 6px 9px;
      font-size: 12px;
      margin-top: 10px;
    }

    .delete-button:hover {
      background: #f8f8f8;
      color: #d33;
      border-color: #ddd;
    }

    .empty {
      text-align: center;
      color: #999;
      padding: 30px 10px;
      font-size: 14px;
    }

    .notice {
      text-align: center;
      color: #aaa;
      font-size: 12px;
      margin-top: 20px;
    }

    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 100%;
      max-width: 620px;
      background: rgba(255,255,255,0.96);
      border-top: 1px solid #e8e8e8;
      box-shadow: 0 -3px 15px rgba(0,0,0,0.06);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      z-index: 1000;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .nav-button {
      border: none;
      background: transparent;
      padding: 12px 5px 11px;
      color: #999;
      font-size: 12px;
    }

    .nav-button .nav-icon {
      display: block;
      font-size: 20px;
      margin-bottom: 3px;
    }

    .nav-button.active {
      color: #222;
      font-weight: 700;
    }

    @media (max-width: 420px) {
      .container {
        padding-left: 13px;
        padding-right: 13px;
      }

      .card {
        padding: 18px;
      }

      .summary-box .number {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="icon">💍</div>
    <h1>축의대 관리</h1>
    <p>축의금 접수 및 식권 관리</p>
  </div>


  <!-- =========================
       접수하기
  ========================== -->

  <div id="page-register" class="page active">

    <div class="card">

      <span class="label">구분</span>

      <div class="side-buttons">

        <button
          type="button"
          class="side-button active"
          onclick="selectSide('신랑측', this)"
        >
          🤵 신랑측
        </button>

        <button
          type="button"
          class="side-button"
          onclick="selectSide('신부측', this)"
        >
          👰 신부측
        </button>

      </div>


      <div class="envelope-number-box">
        <span>현재 봉투번호</span>
        <strong id="nextEnvelopeNumber">1</strong>
      </div>


      <span class="label">이름</span>

      <input
        id="name"
        type="text"
        placeholder="이름을 입력하세요"
        autocomplete="off"
      >


      <span class="label">축의금</span>

      <div class="amount-buttons">

        <button
          type="button"
          class="amount-button"
          onclick="setAmount(50000)"
        >
          5만원
        </button>

        <button
          type="button"
          class="amount-button"
          onclick="setAmount(100000)"
        >
          10만원
        </button>

        <button
          type="button"
          class="amount-button"
          onclick="setAmount(200000)"
        >
          20만원
        </button>

        <button
          type="button"
          class="amount-button"
          onclick="setAmount(300000)"
        >
          30만원
        </button>

        <button
          type="button"
          class="amount-button"
          onclick="setAmount(500000)"
        >
          50만원
        </button>

        <button
          type="button"
          class="amount-button"
          onclick="setAmount(1000000)"
        >
          100만원
        </button>

      </div>


      <input
        id="amount"
        type="number"
        placeholder="금액을 직접 입력하세요"
        min="0"
      >


      <span class="label">대인 식권</span>

      <input
        id="adultMeal"
        type="number"
        value="0"
        min="0"
        placeholder="대인 식권 수량"
      >


      <span class="label">소인 식권</span>

      <input
        id="childMeal"
        type="number"
        value="0"
        min="0"
        placeholder="소인 식권 수량"
      >


      <span class="label">답례봉투</span>

      <input
        id="replyEnvelope"
        type="number"
        value="0"
        min="0"
        placeholder="답례봉투 수량"
      >


      <span class="label">접수방법</span>

      <div class="side-buttons">

        <button
          type="button"
          id="cashButton"
          class="side-button active"
          onclick="selectPayment('현금', this)"
        >
          💵 현금
        </button>

        <button
          type="button"
          id="transferButton"
          class="side-button"
          onclick="selectPayment('계좌이체', this)"
        >
          🏦 계좌이체
        </button>

      </div>


      <span class="label">메모</span>

      <textarea
        id="memo"
        rows="2"
        placeholder="필요한 내용을 메모해주세요"
      ></textarea>


      <button
        type="button"
        id="submitButton"
        class="submit-button"
        onclick="submitGift()"
      >
        접수하기
      </button>

      <div id="status" class="status"></div>

    </div>

  </div>


  <!-- =========================
       접수내역
  ========================== -->

  <div id="page-records" class="page">

    <div class="card">

      <div class="list-header">

        <h2>📋 접수내역</h2>

        <button
          type="button"
          class="refresh-button"
          onclick="loadRecords()"
        >
          🔄 새로고침
        </button>

      </div>


      <input
        id="search"
        class="search"
        type="text"
        placeholder="🔎 이름 검색"
        oninput="renderRecords()"
      >


      <div class="filter-buttons">

        <button
          type="button"
          class="filter-button active"
          onclick="selectFilter('전체', this)"
        >
          전체
        </button>

        <button
          type="button"
          class="filter-button"
          onclick="selectFilter('신랑측', this)"
        >
          🤵 신랑측
        </button>

        <button
          type="button"
          class="filter-button"
          onclick="selectFilter('신부측', this)"
        >
          👰 신부측
        </button>

      </div>


      <div id="recordList">

        <div class="empty">
          불러오는 중...
        </div>

      </div>

    </div>

  </div>


  <!-- =========================
       총 현황
  ========================== -->

  <div id="page-summary" class="page">

    <div class="summary">

      <div class="summary-box">
        <div class="number" id="count">-</div>
        <div class="title">전체 접수</div>
      </div>

      <div class="summary-box">
        <div class="number" id="total">-</div>
        <div class="title">총 금액</div>
      </div>

      <div class="summary-box">
        <div class="number" id="adultMealTotal">-</div>
        <div class="title">대인 식권</div>
      </div>

      <div class="summary-box">
        <div class="number" id="childMealTotal">-</div>
        <div class="title">소인 식권</div>
      </div>

      <div class="summary-box">
        <div class="number" id="replyEnvelopeTotal">-</div>
        <div class="title">답례봉투</div>
      </div>

      <div class="summary-box">
        <div class="number" id="transferTotal">-</div>
        <div class="title">계좌이체</div>
      </div>

    </div>

    <div class="notice">
      💐 축의대 접수 프로그램
    </div>

  </div>

</div>


<!-- =========================
     하단 탭
========================== -->

<nav class="bottom-nav">

  <button
    type="button"
    id="navRegister"
    class="nav-button active"
    onclick="showPage('register')"
  >
    <span class="nav-icon">✍️</span>
    접수하기
  </button>

  <button
    type="button"
    id="navRecords"
    class="nav-button"
    onclick="showPage('records')"
  >
    <span class="nav-icon">📋</span>
    접수내역
  </button>

  <button
    type="button"
    id="navSummary"
    class="nav-button"
    onclick="showPage('summary')"
  >
    <span class="nav-icon">📊</span>
    총 현황
  </button>

</nav>


<script>

  /*
   * =====================================
   * Supabase
   * =====================================
   */

  const SUPABASE_URL =
    "https://snsschroqinfhqdopxyu.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_XURZS8NolmcPdWztVI5uzA_4ULYxiZI";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /*
   * =====================================
   * 상태값
   * =====================================
   */

  let selectedSide = "신랑측";

  let selectedFilter = "전체";

  let records = [];

  let selectedPayment = "현금";

  let nextEnvelopeNumber = 1;


  /*
   * =====================================
   * 화면 전환
   * =====================================
   */

  function showPage(page) {

    document
      .querySelectorAll(".page")
      .forEach(function(section) {
        section.classList.remove("active");
      });


    document
      .getElementById("page-" + page)
      .classList.add("active");


    document
      .querySelectorAll(".nav-button")
      .forEach(function(button) {
        button.classList.remove("active");
      });


    if (page === "register") {

      document
        .getElementById("navRegister")
        .classList.add("active");

    }


    if (page === "records") {

      document
        .getElementById("navRecords")
        .classList.add("active");

      renderRecords();

    }


    if (page === "summary") {

      document
        .getElementById("navSummary")
        .classList.add("active");

      updateSummary();

    }


    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }


  /*
   * =====================================
   * 다음 봉투번호 계산
   * =====================================
   */

  function updateNextEnvelopeNumber() {

    const sideNumbers =
      records
        .filter(function(item) {

          return (
            item.side === selectedSide &&
            item.envelope_number !== null &&
            item.envelope_number !== undefined &&
            Number(item.envelope_number) > 0
          );

        })
        .map(function(item) {

          return Number(item.envelope_number);

        });


    if (sideNumbers.length === 0) {

      nextEnvelopeNumber = 1;

    } else {

      nextEnvelopeNumber =
        Math.max.apply(null, sideNumbers) + 1;

    }


    const numberElement =
      document.getElementById("nextEnvelopeNumber");


    if (numberElement) {

      numberElement.textContent =
        nextEnvelopeNumber;

    }

  }


  /*
   * =====================================
   * 신랑 / 신부 선택
   * =====================================
   */

  function selectSide(side, button) {

    selectedSide = side;


    document
      .querySelectorAll(".side-button")
      .forEach(function(btn) {

        if (
          btn.id !== "cashButton" &&
          btn.id !== "transferButton"
        ) {
          btn.classList.remove("active");
        }

      });


    button.classList.add("active");


    updateNextEnvelopeNumber();

  }


  /*
   * =====================================
   * 접수방법 선택
   * =====================================
   */

  function selectPayment(payment, button) {

    selectedPayment = payment;


    document
      .querySelectorAll("#cashButton, #transferButton")
      .forEach(function(btn) {

        btn.classList.remove("active");

      });


    button.classList.add("active");

  }


  /*
   * =====================================
   * 금액
   * =====================================
   */

  function setAmount(amount) {

    document.getElementById("amount").value =
      amount;

  }


  /*
   * =====================================
   * 축의금 저장
   * =====================================
   */

  async function submitGift() {

    const name =
      document
        .getElementById("name")
        .value
        .trim();


    const amount =
      Number(
        document.getElementById("amount").value
      );


    const adultMeal =
      Number(
        document.getElementById("adultMeal").value
      ) || 0;


    const childMeal =
      Number(
        document.getElementById("childMeal").value
      ) || 0;


    const replyEnvelope =
      Number(
        document.getElementById("replyEnvelope").value
      ) || 0;


    const memo =
      document
        .getElementById("memo")
        .value
        .trim();


    const status =
      document.getElementById("status");


    const button =
      document.getElementById("submitButton");


    if (!name) {

      alert("이름을 입력해주세요.");

      document
        .getElementById("name")
        .focus();

      return;

    }


    if (!amount || amount <= 0) {

      alert("축의금을 입력해주세요.");

      document
        .getElementById("amount")
        .focus();

      return;

    }


    button.disabled = true;

    button.textContent = "저장 중...";

    status.textContent = "";


    /*
     * 현재 화면에 표시된 번호를 저장
     */

    const envelopeNumber =
      nextEnvelopeNumber;


    const result =
      await supabaseClient
        .from("gifts")
        .insert({
          side: selectedSide,
          name: name,
          amount: amount,
          adult_meal: adultMeal,
          child_meal: childMeal,
          reply_envelope: replyEnvelope,
          payment_method: selectedPayment,
          memo: memo || null,
        });


    if (result.error) {

      console.error(
        "Supabase 오류:",
        result.error
      );


      status.textContent =
        "❌ 저장 실패: " +
        result.error.message;


      alert(
        "저장에 실패했습니다.\n\n" +
        "오류 내용:\n" +
        result.error.message
      );

    } else {

      status.textContent =
        "✅ 접수가 완료되었습니다!";


      alert(
        name +
        "님 접수가 완료되었습니다!\n\n" +
        "봉투번호 " +
        envelopeNumber +
        "번\n" +
        amount.toLocaleString() +
        "원\n" +
        "대인 식권 " +
        adultMeal +
        "장 / 소인 식권 " +
        childMeal +
        "장\n" +
        "답례봉투 " +
        replyEnvelope +
        "개\n" +
        "접수방법: " +
        selectedPayment
      );


      document.getElementById("name").value = "";

      document.getElementById("amount").value = "";

      document.getElementById("adultMeal").value = "0";

      document.getElementById("childMeal").value = "0";

      document.getElementById("replyEnvelope").value = "0";

      document.getElementById("memo").value = "";


      selectedPayment = "현금";


      document
        .querySelectorAll("#cashButton, #transferButton")
        .forEach(function(btn) {

          btn.classList.remove("active");

        });


      document
        .getElementById("cashButton")
        .classList.add("active");


      await loadRecords();

    }


    button.disabled = false;

    button.textContent = "접수하기";

  }


  /*
   * =====================================
   * DB에서 접수내역 불러오기
   * =====================================
   */

  async function loadRecords() {

    const list =
      document.getElementById("recordList");


    if (list) {

      list.innerHTML =
        '<div class="empty">불러오는 중...</div>';

    }


    const result =
      await supabaseClient
        .from("gifts")
        .select("*")
        .order("created_at", {
          ascending: false
        });


    if (result.error) {

      console.error(result.error);

      if (list) {

        list.innerHTML =
          '<div class="empty">접수내역을 불러오지 못했습니다.</div>';

      }

      return;

    }


    records =
      result.data || [];


    updateSummary();

    updateNextEnvelopeNumber();

    renderRecords();

  }


  /*
   * =====================================
   * 통계
   * =====================================
   */

  function updateSummary() {

    const count =
      records.length;


    const total =
      records.reduce(
        function(sum, item) {

          return sum +
            Number(item.amount || 0);

        },
        0
      );


    const adultMealTotal =
      records.reduce(
        function(sum, item) {

          return sum +
            Number(item.adult_meal || 0);

        },
        0
      );


    const childMealTotal =
      records.reduce(
        function(sum, item) {

          return sum +
            Number(item.child_meal || 0);

        },
        0
      );


    const replyEnvelopeTotal =
      records.reduce(
        function(sum, item) {

          return sum +
            Number(item.reply_envelope || 0);

        },
        0
      );


    const transferTotal =
      records.filter(
        function(item) {

          return item.payment_method === "계좌이체";

        }
      ).length;


    document.getElementById("count").textContent =
      count.toLocaleString() + "명";


    document.getElementById("total").textContent =
      total.toLocaleString() + "원";


    document.getElementById("adultMealTotal").textContent =
      adultMealTotal.toLocaleString() + "장";


    document.getElementById("childMealTotal").textContent =
      childMealTotal.toLocaleString() + "장";


    document.getElementById("replyEnvelopeTotal").textContent =
      replyEnvelopeTotal.toLocaleString() + "개";


    document.getElementById("transferTotal").textContent =
      transferTotal.toLocaleString() + "명";

  }


  /*
   * =====================================
   * 필터 선택
   * =====================================
   */

  function selectFilter(filter, button) {

    selectedFilter = filter;


    document
      .querySelectorAll(".filter-button")
      .forEach(function(btn) {

        btn.classList.remove("active");

      });


    button.classList.add("active");


    renderRecords();

  }


  /*
   * =====================================
   * 접수내역 삭제
   * =====================================
   */

  async function deleteRecord(id) {

    const item =
      records.find(function(record) {

        return String(record.id) === String(id);

      });


    if (!item) {

      alert("삭제할 접수내역을 찾을 수 없습니다.");

      return;

    }


    const adultMeal =
      Number(item.adult_meal || 0);


    const childMeal =
      Number(item.child_meal || 0);


    const replyEnvelope =
      Number(item.reply_envelope || 0);


    const paymentMethod =
      item.payment_method || "미기록";


    const envelopeNumber =
      item.envelope_number;


    const envelopeText =
      envelopeNumber !== null &&
      envelopeNumber !== undefined
        ? "봉투번호 " + envelopeNumber + "번\n"
        : "";


    const confirmed =
      confirm(
        "정말 삭제하시겠습니까?\n\n" +
        envelopeText +
        item.name +
        " / " +
        Number(item.amount || 0).toLocaleString() +
        "원\n" +
        "대인 식권 " +
        adultMeal +
        "장 / 소인 식권 " +
        childMeal +
        "장\n" +
        "답례봉투 " +
        replyEnvelope +
        "개\n" +
        "접수방법: " +
        paymentMethod
      );


    if (!confirmed) {

      return;

    }


    const result =
      await supabaseClient
        .from("gifts")
        .delete()
        .eq("id", id);


    if (result.error) {

      console.error(
        "삭제 오류:",
        result.error
      );


      alert(
        "삭제에 실패했습니다.\n\n" +
        result.error.message
      );


      return;

    }


    alert(
      item.name +
      "님의 접수내역이 삭제되었습니다."
    );


    await loadRecords();

  }


  /*
   * =====================================
   * 접수내역 화면
   * =====================================
   */

  function renderRecords() {

    const list =
      document.getElementById("recordList");


    if (!list) {

      return;

    }


    const search =
      document
        .getElementById("search")
        .value
        .trim()
        .toLowerCase();


    const filtered =
      records.filter(function(item) {

        const matchesSide =
          selectedFilter === "전체" ||
          item.side === selectedFilter;


        const matchesSearch =
          !search ||
          String(item.name || "")
            .toLowerCase()
            .includes(search);


        return matchesSide && matchesSearch;

      });


    if (filtered.length === 0) {

      list.innerHTML =
        '<div class="empty">접수내역이 없습니다.</div>';

      return;

    }


    list.innerHTML =
      filtered
        .map(function(item) {

          const side =
            item.side || "-";


          const name =
            item.name || "-";


          const amount =
            Number(item.amount || 0)
              .toLocaleString();


          const adultMeal =
            Number(item.adult_meal || 0);


          const childMeal =
            Number(item.child_meal || 0);


          const replyEnvelope =
            Number(item.reply_envelope || 0);


          const paymentMethod =
            item.payment_method || "미기록";


          const memo =
            item.memo || "";


          const envelopeNumber =
            item.envelope_number;


          const envelopeText =
            envelopeNumber !== null &&
            envelopeNumber !== undefined
              ? "🎟 봉투 " +
                Number(envelopeNumber) +
                "번"
              : "🎟 번호 없음";


          return `
            <div class="record">

              <div class="record-main">

                <div class="record-name">
                  ${escapeHtml(name)}
                </div>

                <div class="record-amount">
                  ${amount}원
                </div>

              </div>


              <div class="record-info">

                <span class="badge">
                  ${escapeHtml(envelopeText)}
                </span>


                <span class="badge">
                  ${escapeHtml(side)}
                </span>


                <span class="badge">
                  ${
                    paymentMethod === "계좌이체"
                      ? "🏦 계좌이체"
                      : paymentMethod === "현금"
                        ? "💵 현금"
                        : "❓ 미기록"
                  }
                </span>


                <span>
                  🎫 대인 ${adultMeal}장
                </span>


                <span>
                  🧒 소인 ${childMeal}장
                </span>


                <span>
                  💌 답례봉투 ${replyEnvelope}개
                </span>

              </div>


              ${
                memo
                  ? `
                    <div class="memo-text">
                      📝 ${escapeHtml(memo)}
                    </div>
                  `
                  : ""
              }


              <button
                type="button"
                class="delete-button"
                onclick="deleteRecord('${item.id}')"
              >
                🗑 삭제
              </button>

            </div>
          `;

        })
        .join("");

  }


  /*
   * =====================================
   * HTML 문자 안전 처리
   * =====================================
   */

  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /*
   * =====================================
   * 시작
   * =====================================
   */

  loadRecords();

</script>

</body>
</html>
