<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시은❤️성빈 축의대 (신부측)</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    #loginScreen {
      position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background: #f7f5f2; padding: 20px;
    }
    .login-box {
      width: 100%; max-width: 380px; background: white; border-radius: 20px; padding: 32px 24px; text-align: center; box-shadow: 0 4px 18px rgba(0,0,0,0.05);
    }
    .login-icon { font-size: 40px; margin-bottom: 10px; }
    .login-box h1 { margin: 0; font-size: 26px; }
    .login-box p { margin: 8px 0 24px; color: #888; font-size: 14px; }
    .login-box input { margin-bottom: 12px; }
    .login-box button { width: 100%; border: none; border-radius: 13px; padding: 15px; background: #d66b91; color: white; font-size: 16px; font-weight: 600; }
    #loginStatus { min-height: 20px; margin-top: 12px; font-size: 13px; color: #d33; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif; background: #f7f5f2; color: #333; padding-bottom: 82px; }
    button, input, textarea { font-family: inherit; }
    button { cursor: pointer; }
    .container { width: 100%; max-width: 620px; min-height: 100vh; margin: 0 auto; padding: 32px 18px 30px; }
    .header { text-align: center; margin-bottom: 26px; }
    .header .icon { font-size: 40px; margin-bottom: 8px; }
    .header h1 { margin: 0; font-size: 28px; color: #d66b91; }
    .header p { margin: 8px 0 0; color: #888; font-size: 14px; }
    .card { background: white; border-radius: 20px; padding: 22px; margin-bottom: 16px; box-shadow: 0 4px 18px rgba(0,0,0,0.05); }
    .label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 9px; }
    .envelope-number-box { display: flex; align-items: center; justify-content: space-between; background: #f7f5f2; border-radius: 12px; padding: 11px 14px; margin-bottom: 12px; }
    .envelope-number-box span { color: #888; font-size: 13px; }
    .envelope-number-box strong { font-size: 20px; font-weight: 700; color: #d66b91; }
    #editEnvelopeNumberTitle { display: none; margin-top: 6px; margin-bottom: 7px; font-size: 14px; font-weight: 600; color: #333; }
    #editEnvelopeNumber { margin-bottom: 17px; }
    input { width: 100%; padding: 13px; border: 1px solid #ddd; border-radius: 11px; font-size: 16px; outline: none; margin-bottom: 17px; background: white; }
    input:focus, textarea:focus { border-color: #d66b91; }
    textarea { width: 100%; height: 48px; padding: 13px; border: 1px solid #ddd; border-radius: 11px; font-size: 16px; outline: none; resize: none; margin-bottom: 17px; background: white; }
    .ticket-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 17px; }
    .ticket-box { text-align: center; }
    .ticket-title { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
    .counter { display: flex; align-items: center; justify-content: center; border: 1px solid #ddd; border-radius: 11px; background: white; overflow: hidden; }
    .counter-button { width: 32px; height: 42px; border: none; background: #f7f5f2; font-size: 20px; color: #555; padding: 0; }
    .counter-button:active { background: #e9e7e4; }
    .counter input { width: 32px; height: 42px; border: none; border-radius: 0; padding: 0; margin: 0; text-align: center; font-size: 16px; font-weight: 600; background: white; }
    .side-buttons { display: flex; gap: 9px; margin-bottom: 20px; }
    .side-button { flex: 1; border: 1px solid #ddd; background: white; border-radius: 12px; padding: 12px; font-size: 15px; }
    .side-button.active { background: #d66b91; color: white; border-color: #d66b91; }
    .amount-buttons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-bottom: 11px; }
    .amount-button { padding: 10px 4px; border: 1px solid #ddd; background: white; border-radius: 9px; font-size: 14px; }
    .amount-button:active { background: #f1f1f1; }
    .submit-button { width: 100%; border: none; border-radius: 13px; padding: 15px; background: #d66b91; color: white; font-size: 17px; font-weight: 600; }
    .submit-button:disabled { background: #aaa; cursor: wait; }
    .status { text-align: center; margin-top: 14px; font-size: 14px; min-height: 20px; word-break: break-word; }
    .page { display: none; }
    .page.active { display: block; }
    .summary { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 16px; }
    .summary-box { background: white; border-radius: 15px; padding: 15px 8px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.04); }
    .summary-box .number { font-size: 18px; font-weight: 700; margin-bottom: 4px; color: #d66b91; }
    .summary-box .title { font-size: 11px; color: #999; }
    .list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .list-header h2 { margin: 0; font-size: 19px; }
    .refresh-button { border: 1px solid #ddd; background: white; border-radius: 9px; padding: 7px 11px; font-size: 12px; }
    .search { margin-bottom: 12px; }
    .filter-buttons { display: flex; gap: 7px; margin-bottom: 15px; }
    .filter-button { border: 1px solid #ddd; background: white; border-radius: 9px; padding: 8px 13px; font-size: 13px; }
    .filter-button.active { background: #d66b91; color: white; border-color: #d66b91; }
    .side-badge.bride { background: #fff0f5; color: #d66b91; border: 1px solid #ffd9e5; }
    .record { border-top: 1px solid #eee; padding: 14px 0; }
    .record:first-child { border-top: none; }
    .record-main { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .record-name { font-weight: 700; font-size: 16px; }
    .record-amount { font-weight: 700; font-size: 16px; white-space: nowrap; }
    .record-info { display: flex; gap: 8px; margin-top: 6px; color: #888; font-size: 12px; flex-wrap: wrap; }
    .badge { padding: 3px 7px; border-radius: 6px; background: #f1f1f1; }
    .memo-text { margin-top: 8px; padding: 9px 10px; background: #fafafa; border-radius: 8px; color: #777; font-size: 12px; white-space: pre-wrap; word-break: break-word; }
    .edit-button, .delete-button { border: 1px solid #eee; background: #fff; color: #777; border-radius: 8px; padding: 6px 9px; font-size: 12px; margin-top: 10px; margin-right: 5px; }
    .delete-button:hover { color: #d33; }
    .empty { text-align: center; color: #999; padding: 30px 10px; font-size: 14px; }
    .notice { text-align: center; color: #aaa; font-size: 12px; margin-top: 20px; }
    .bottom-nav { position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); width: 100%; max-width: 620px; background: rgba(255,255,255,0.96); border-top: 1px solid #e8e8e8; box-shadow: 0 -3px 15px rgba(0,0,0,0.06); display: grid; grid-template-columns: repeat(3, 1fr); z-index: 1000; padding-bottom: env(safe-area-inset-bottom); }
    .nav-button { border: none; background: transparent; padding: 12px 5px 11px; color: #999; font-size: 12px; }
    .nav-button .nav-icon { display: block; font-size: 20px; margin-bottom: 3px; }
    .nav-button.active { color: #d66b91; font-weight: 700; }
  </style>
</head>
<body>

<div id="app" class="container">
  <div id="loginScreen">
    <div class="login-box">
      <div class="login-icon">👰🏻‍♀️</div>
      <h1>신부측 축의대</h1>
      <p>비밀번호를 입력해주세요.</p>
      <input id="loginPassword" type="password" placeholder="비밀번호" autocomplete="current-password">
      <button type="button" onclick="login()">입장하기</button>
      <div id="loginStatus"></div>
    </div>
  </div>

  <div class="header">
    <div class="icon">👰🏻‍♀️</div>
    <h1>신부측 축의대 관리</h1>
    <p>시은 ❤️ 성빈 결혼식 축의금 접수</p>
  </div>

  <!-- 접수하기 -->
  <div id="page-register" class="page active">
    <div class="card">
      <div class="envelope-number-box">
        <span>현재 봉투번호</span>
        <strong id="nextEnvelopeNumber">1</strong>
      </div>

      <div id="editEnvelopeNumberTitle">봉투번호 수정</div>
      <input id="editEnvelopeNumber" type="number" min="1" placeholder="수정할 봉투번호" style="display:none;">

      <span class="label">이름</span>
      <input id="name" type="text" placeholder="이름을 입력하세요" autocomplete="off">

      <span class="label">축의금</span>
      <div class="amount-buttons">
        <button type="button" class="amount-button" onclick="setAmount(50000)">5만원</button>
        <button type="button" class="amount-button" onclick="setAmount(100000)">10만원</button>
        <button type="button" class="amount-button" onclick="setAmount(200000)">20만원</button>
        <button type="button" class="amount-button" onclick="setAmount(300000)">30만원</button>
        <button type="button" class="amount-button" onclick="setAmount(500000)">50만원</button>
        <button type="button" class="amount-button" onclick="setAmount(1000000)">100만원</button>
      </div>
      <input id="amount" type="number" placeholder="금액을 직접 입력하세요" min="0">

      <span class="label">접수방법</span>
      <div class="side-buttons">
        <button type="button" id="cashButton" class="side-button active" onclick="selectPayment('현금', this)">💵 현금</button>
        <button type="button" id="transferButton" class="side-button" onclick="selectPayment('계좌이체', this)">🏦 계좌이체</button>
      </div>
      
      <div class="ticket-row">
        <div class="ticket-box">
          <span class="ticket-title">대인 식권🧑🏻</span>
          <div class="counter">
            <button type="button" class="counter-button" onclick="changeCount('adultMeal', -1)">−</button>
            <input id="adultMeal" type="number" value="0" min="0" readonly>
            <button type="button" class="counter-button" onclick="changeCount('adultMeal', 1)">+</button>
          </div>
        </div>
        <div class="ticket-box">
          <span class="ticket-title">소인 식권👶🏻</span>
          <div class="counter">
            <button type="button" class="counter-button" onclick="changeCount('childMeal', -1)">−</button>
            <input id="childMeal" type="number" value="0" min="0" readonly>
            <button type="button" class="counter-button" onclick="changeCount('childMeal', 1)">+</button>
          </div>
        </div>
        <div class="ticket-box">
          <span class="ticket-title">답례봉투✉️</span>
          <div class="counter">
            <button type="button" class="counter-button" onclick="changeCount('replyEnvelope', -1)">−</button>
            <input id="replyEnvelope" type="number" value="0" min="0" readonly>
            <button type="button" class="counter-button" onclick="changeCount('replyEnvelope', 1)">+</button>
          </div>
        </div>
      </div>

      <span class="label">메모</span>
      <textarea id="memo" rows="2" placeholder="필요한 내용을 메모해주세요"></textarea>

      <button type="button" id="submitButton" class="submit-button" onclick="submitGift()">신부측 접수하기</button>
      <div id="status" class="status"></div>
    </div>
  </div>

  <!-- 접수내역 -->
  <div id="page-records" class="page">
    <div class="card">
      <div class="list-header">
        <h2>📋 신부측 접수내역</h2>
        <button type="button" class="refresh-button" onclick="loadRecords()">🔄 새로고침</button>
      </div>
      <input id="search" class="search" type="text" placeholder="🔎 이름 검색" oninput="renderRecords()">
      <div id="recordList">
        <div class="empty">불러오는 중...</div>
      </div>
    </div>
  </div>

  <!-- 총 현황 -->
  <div id="page-summary" class="page">
    <div class="summary">
      <div class="summary-box">
        <div class="number" id="count">-</div>
        <div class="title">접수 인원</div>
      </div>
      <div class="summary-box">
        <div class="number" id="total">-</div>
        <div class="title">총 금액</div>
      </div>
      <div class="summary-box">
        <div class="number" id="adultMealTotal">-</div>
        <div class="title">대인 식권</div>
      </div>
      <div class="summary-box">
        <div class="number" id="childMealTotal">-</div>
        <div class="title">소인 식권</div>
      </div>
      <div class="summary-box">
        <div class="number" id="replyEnvelopeTotal">-</div>
        <div class="title">답례봉투</div>
      </div>
      <div class="summary-box">
        <div class="number" id="transferTotal">-</div>
        <div class="title">계좌이체</div>
      </div>
    </div>
    <div class="notice">💐 신부측 축의대 접수 프로그램 made by 시은</div>
  </div>
</div>

<nav class="bottom-nav">
  <button type="button" id="navRegister" class="nav-button active" onclick="showPage('register')">
    <span class="nav-icon">✍️</span>접수하기
  </button>
  <button type="button" id="navRecords" class="nav-button" onclick="showPage('records')">
    <span class="nav-icon">📋</span>접수내역
  </button>
  <button type="button" id="navSummary" class="nav-button" onclick="showPage('summary')">
    <span class="nav-icon">📊</span>총 현황
  </button>
</nav>

<script>
  const SUPABASE_URL = "https://snsschroqinfhqdopxyv.supabase.co";
  const SUPABASE_KEY = "sb_publishable_XURZS8NolmcPdWztVI5uzA_4ULYxiZI";
  const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbyiV84KvW4-lLZqsMZPcfgIFEl8yz03zD7jOcw2w68XfVezmuiZZzp9dSbFCZBNXjTB1Q/exec";

  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  function syncGoogleSheet(action, gift) {
    try {
      fetch(GOOGLE_SHEET_URL, {
        method: "POST", mode: "no-cors", keepalive: true,
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: action, gift: gift })
      }).catch(function(error) { console.error("Google Sheets 연동 오류:", error); });
    } catch (error) { console.error("Google Sheets 연동 오류:", error); }
  }

  async function login() {
    const password = document.getElementById("loginPassword").value.trim();
    const status = document.getElementById("loginStatus");
    if (!password) { status.textContent = "비밀번호를 입력해주세요."; return; }
    status.textContent = "확인 중...";

    const result = await supabaseClient.auth.signInWithPassword({ email: "sieun@wedding.com", password: password });
    if (result.error) {
      status.textContent = "❌ 비밀번호가 올바르지 않습니다.";
      return;
    }
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("app").style.display = "block";
  }

  const fixedSide = "신부측";
  let records = [];
  let selectedPayment = "현금";
  let nextEnvelopeNumber = 1;
  let editingRecordId = null;

  function showPage(page) {
    document.querySelectorAll(".page").forEach(function(s) { s.classList.remove("active"); });
    document.getElementById("page-" + page).classList.add("active");
    document.querySelectorAll(".nav-button").forEach(function(b) { b.classList.remove("active"); });
    if (page === "register") document.getElementById("navRegister").classList.add("active");
    if (page === "records") { document.getElementById("navRecords").classList.add("active"); renderRecords(); }
    if (page === "summary") { document.getElementById("navSummary").classList.add("active"); updateSummary(); }
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function updateNextEnvelopeNumber() {
    const sideNumbers = records
      .filter(function(item) { return item.side === fixedSide && Number(item.envelope_number) > 0; })
      .map(function(item) { return Number(item.envelope_number); });

    nextEnvelopeNumber = sideNumbers.length === 0 ? 1 : Math.max.apply(null, sideNumbers) + 1;
    document.getElementById("nextEnvelopeNumber").textContent = nextEnvelopeNumber;
  }

  function selectPayment(payment, button) {
    selectedPayment = payment;
    document.querySelectorAll("#cashButton, #transferButton").forEach(function(btn) { btn.classList.remove("active"); });
    button.classList.add("active");
  }

  function setAmount(amount) { document.getElementById("amount").value = amount; }

  function changeCount(id, amount) {
    const input = document.getElementById(id);
    if (!input) return;
    let value = Number(input.value) || 0;
    value += amount;
    if (value < 0) value = 0;
    input.value = value;
  }

  function resetForm() {
    document.getElementById("name").value = "";
    document.getElementById("amount").value = "";
    document.getElementById("adultMeal").value = "0";
    document.getElementById("childMeal").value = "0";
    document.getElementById("replyEnvelope").value = "0";
    document.getElementById("memo").value = "";
    document.getElementById("editEnvelopeNumber").value = "";
    document.getElementById("editEnvelopeNumberTitle").style.display = "none";
    document.getElementById("editEnvelopeNumber").style.display = "none";
    selectedPayment = "현금";
    document.querySelectorAll("#cashButton, #transferButton").forEach(function(btn) { btn.classList.remove("active"); });
    document.getElementById("cashButton").classList.add("active");
  }

  async function submitGift() {
    const name = document.getElementById("name").value.trim();
    const amount = Number(document.getElementById("amount").value);
    const adultMeal = Number(document.getElementById("adultMeal").value) || 0;
    const childMeal = Number(document.getElementById("childMeal").value) || 0;
    const replyEnvelope = Number(document.getElementById("replyEnvelope").value) || 0;
    const memo = document.getElementById("memo").value.trim();
    const status = document.getElementById("status");
    const button = document.getElementById("submitButton");

    if (!name) { alert("이름을 입력해주세요."); document.getElementById("name").focus(); return; }
    if (!amount || amount <= 0) { alert("축의금을 입력해주세요."); document.getElementById("amount").focus(); return; }

    button.disabled = true;
    button.textContent = editingRecordId ? "수정 저장 중..." : "저장 중...";
    status.textContent = "";

    try {
      if (editingRecordId) {
        const envelopeNumber = Number(document.getElementById("editEnvelopeNumber").value);
        if (!envelopeNumber || envelopeNumber <= 0) { alert("봉투번호를 입력해주세요."); document.getElementById("editEnvelopeNumber").focus(); return; }

        const result = await supabaseClient.from("gifts").update({
          side: fixedSide, envelope_number: envelopeNumber, name: name, amount: amount,
          adult_meal: adultMeal, child_meal: childMeal, reply_envelope: replyEnvelope,
          payment_method: selectedPayment, memo: memo || null
        }).eq("id", editingRecordId).select().single();

        if (result.error) { alert("수정 실패: " + result.error.message); return; }

        syncGoogleSheet("update", {
          id: String(editingRecordId), envelope_number: envelopeNumber, side: fixedSide,
          name: name, relation: "", amount: amount, adult_meal: adultMeal, child_meal: childMeal,
          reply_envelope: replyEnvelope, payment_method: selectedPayment, memo: memo || ""
        });

        alert(name + "님의 접수내역이 수정되었습니다!");
        editingRecordId = null;
        resetForm();
        button.textContent = "신부측 접수하기";
        status.textContent = "✅ 수정이 완료되었습니다!";
        await loadRecords();
        updateNextEnvelopeNumber();
        return;
      }

      const envelopeNumber = nextEnvelopeNumber;
      const result = await supabaseClient.from("gifts").insert({
        side: fixedSide, envelope_number: envelopeNumber, name: name, amount: amount,
        adult_meal: adultMeal, child_meal: childMeal, reply_envelope: replyEnvelope,
        payment_method: selectedPayment, memo: memo || null
      }).select().single();

      if (result.error) { alert("저장 실패: " + result.error.message); return; }

      syncGoogleSheet("insert", {
        id: result.data?.id ? String(result.data.id) : "", envelope_number: envelopeNumber,
        side: fixedSide, name: name, relation: "", amount: amount, adult_meal: adultMeal,
        child_meal: childMeal, reply_envelope: replyEnvelope, payment_method: selectedPayment, memo: memo || ""
      });

      status.textContent = "✅ 접수가 완료되었습니다!";
      alert(name + "님 신부측 접수가 완료되었습니다!\n봉투번호 " + envelopeNumber + "번\n" + amount.toLocaleString() + "원");
      resetForm();
      await loadRecords();
      updateNextEnvelopeNumber();
    } catch (error) {
      alert("오류 발생: " + error.message);
    } finally {
      button.disabled = false;
      button.textContent = "신부측 접수하기";
    }
  }

  async function loadRecords() {
    const list = document.getElementById("recordList");
    if (list) list.innerHTML = '<div class="empty">불러오는 중...</div>';

    try {
      const result = await supabaseClient.from("gifts").select("*").order("created_at", { ascending: false });
      if (result.error) { if (list) list.innerHTML = '<div class="empty">목록을 불러오지 못했습니다.</div>'; return; }
      records = result.data || [];
      updateSummary();
      renderRecords();
      updateNextEnvelopeNumber();
    } catch (error) {
      if (list) list.innerHTML = '<div class="empty">목록을 불러오지 못했습니다.</div>';
    }
  }

  function updateSummary() {
    // 신부측 페이지만 들어왔으므로 신부측 데이터만 통계에 반영
    const summaryRecords = records.filter(function(item) { return item.side === fixedSide; });

    document.getElementById("count").textContent = summaryRecords.length.toLocaleString() + "명";
    document.getElementById("total").textContent = summaryRecords.reduce(function(sum, i) { return sum + Number(i.amount || 0); }, 0).toLocaleString() + "원";
    document.getElementById("adultMealTotal").textContent = summaryRecords.reduce(function(sum, i) { return sum + Number(i.adult_meal || 0); }, 0).toLocaleString() + "장";
    document.getElementById("childMealTotal").textContent = summaryRecords.reduce(function(sum, i) { return sum + Number(i.child_meal || 0); }, 0).toLocaleString() + "장";
    document.getElementById("replyEnvelopeTotal").textContent = summaryRecords.reduce(function(sum, i) { return sum + Number(i.reply_envelope || 0); }, 0).toLocaleString() + "개";
    document.getElementById("transferTotal").textContent = summaryRecords.filter(function(i) { return i.payment_method === "계좌이체"; }).length.toLocaleString() + "명";
  }

  function editRecord(id) {
    const item = records.find(function(r) { return String(r.id) === String(id); });
    if (!item) return;
    editingRecordId = item.id;

    document.getElementById("editEnvelopeNumber").value = item.envelope_number || "";
    document.getElementById("editEnvelopeNumberTitle").style.display = "block";
    document.getElementById("editEnvelopeNumber").style.display = "block";

    document.getElementById("name").value = item.name || "";
    document.getElementById("amount").value = item.amount || "";
    document.getElementById("adultMeal").value = item.adult_meal || 0;
    document.getElementById("childMeal").value = item.child_meal || 0;
    document.getElementById("replyEnvelope").value = item.reply_envelope || 0;
    document.getElementById("memo").value = item.memo || "";

    selectedPayment = item.payment_method || "현금";
    document.querySelectorAll("#cashButton, #transferButton").forEach(function(btn) { btn.classList.remove("active"); });
    if (selectedPayment === "계좌이체") document.getElementById("transferButton").classList.add("active");
    else document.getElementById("cashButton").classList.add("active");

    document.getElementById("submitButton").textContent = "수정 저장";
    showPage("register");
  }

  async function deleteRecord(id) {
    const item = records.find(function(r) { return String(r.id) === String(id); });
    if (!item) return;
    if (!confirm(item.name + "님의 신부측 내역을 삭제하시겠습니까?")) return;

    const result = await supabaseClient.from("gifts").delete().eq("id", id);
    if (result.error) { alert("삭제 실패: " + result.error.message); return; }

    syncGoogleSheet("delete", { id: String(id), side: item.side, name: item.name, envelope_number: item.envelope_number });
    alert("삭제되었습니다.");
    await loadRecords();
  }

  function renderRecords() {
    const list = document.getElementById("recordList");
    if (!list) return;
    const search = document.getElementById("search") ? document.getElementById("search").value.trim().toLowerCase() : "";

    // 신부측 페이지만 보므로 신부측 데이터만 필터링
    const filtered = records.filter(function(item) {
      return item.side === fixedSide && (!search || String(item.name || "").toLowerCase().includes(search));
    });

    if (filtered.length === 0) {
      list.innerHTML = '<div class="empty">신부측 접수내역이 없습니다.</div>';
      return;
    }

    list.innerHTML = filtered.map(function(item) {
      const name = item.name || "-";
      const envNum = item.envelope_number ? "신부측 " + Number(item.envelope_number) + "번" : "신부측";
      const amount = Number(item.amount || 0).toLocaleString();
      const adult = Number(item.adult_meal || 0) > 0 ? `<span>🎫 대인 ${item.adult_meal}장</span>` : "";
      const child = Number(item.child_meal || 0) > 0 ? `<span>🧒 소인 ${item.child_meal}장</span>` : "";
      const reply = Number(item.reply_envelope || 0) > 0 ? `<span>💌 답례봉투 ${item.reply_envelope}개</span>` : "";
      const payment = item.payment_method === "계좌이체" ? "🏦 계좌이체" : "💵 현금";
      const memo = item.memo ? `<div class="memo-text">📝 ${escapeHtml(item.memo)}</div>` : "";

      return `
        <div class="record">
          <div class="record-main">
            <div class="record-name">${escapeHtml(name)}</div>
            <div class="record-amount">${amount}원</div>
          </div>
          <div class="record-info">
            <span class="badge side-badge bride">${escapeHtml(envNum)}</span>
            <span class="badge">${payment}</span>
            ${adult} ${child} ${reply}
          </div>
          ${memo}
          <button type="button" class="edit-button" onclick="editRecord('${item.id}')">✏️ 수정</button>
          <button type="button" class="delete-button" onclick="deleteRecord('${item.id}')">🗑 삭제</button>
        </div>
      `;
    }).join("");
  }

  function escapeHtml(val) {
    return String(val).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
  }

  loadRecords();
</script>
</body>
</html>
