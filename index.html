<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>축의대 관리</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans KR",
        sans-serif;
      background: #f7f5f2;
      color: #333;
    }

    button,
    input {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    .container {
      width: 100%;
      max-width: 620px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 32px 18px 50px;
    }

    .header {
      text-align: center;
      margin-bottom: 26px;
    }

    .header .icon {
      font-size: 40px;
      margin-bottom: 8px;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
    }

    .header p {
      margin: 8px 0 0;
      color: #888;
      font-size: 14px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 22px;
      margin-bottom: 16px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.05);
    }

    .label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 9px;
    }

    .side-buttons {
      display: flex;
      gap: 9px;
      margin-bottom: 20px;
    }

    .side-button {
      flex: 1;
      border: 1px solid #ddd;
      background: white;
      border-radius: 12px;
      padding: 12px;
      font-size: 15px;
    }

    .side-button.active {
      background: #333;
      color: white;
      border-color: #333;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 11px;
      font-size: 16px;
      outline: none;
      margin-bottom: 17px;
      background: white;
    }

    input:focus {
      border-color: #888;
    }

    .amount-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      margin-bottom: 11px;
    }

    .amount-button {
      padding: 10px 4px;
      border: 1px solid #ddd;
      background: white;
      border-radius: 9px;
      font-size: 14px;
    }

    .amount-button:active {
      background: #f1f1f1;
    }

    .submit-button {
      width: 100%;
      border: none;
      border-radius: 13px;
      padding: 15px;
      background: #222;
      color: white;
      font-size: 17px;
      font-weight: 600;
    }

    .submit-button:disabled {
      background: #aaa;
      cursor: wait;
    }

    .status {
      text-align: center;
      margin-top: 14px;
      font-size: 14px;
      min-height: 20px;
      word-break: break-word;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .summary-box {
      background: white;
      border-radius: 15px;
      padding: 15px 8px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.04);
    }

    .summary-box .number {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .summary-box .title {
      font-size: 11px;
      color: #999;
    }

    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .list-header h2 {
      margin: 0;
      font-size: 19px;
    }

    .refresh-button {
      border: 1px solid #ddd;
      background: white;
      border-radius: 9px;
      padding: 7px 11px;
      font-size: 12px;
    }

    .search {
      margin-bottom: 12px;
    }

    .filter-buttons {
      display: flex;
      gap: 7px;
      margin-bottom: 15px;
    }

    .filter-button {
      border: 1px solid #ddd;
      background: white;
      border-radius: 9px;
      padding: 8px 13px;
      font-size: 13px;
    }

    .filter-button.active {
      background: #333;
      color: white;
      border-color: #333;
    }

    .record {
      border-top: 1px solid #eee;
      padding: 14px 0;
    }

    .record:first-child {
      border-top: none;
    }

    .record-main {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .record-name {
      font-weight: 700;
      font-size: 16px;
    }

    .record-amount {
      font-weight: 700;
      font-size: 16px;
      white-space: nowrap;
    }

    .record-info {
      display: flex;
      gap: 8px;
      margin-top: 6px;
      color: #888;
      font-size: 12px;
      flex-wrap: wrap;
    }

    .badge {
      padding: 3px 7px;
      border-radius: 6px;
      background: #f1f1f1;
    }

    .empty {
      text-align: center;
      color: #999;
      padding: 30px 10px;
      font-size: 14px;
    }

    .notice {
      text-align: center;
      color: #aaa;
      font-size: 12px;
      margin-top: 20px;
    }

    @media (max-width: 420px) {
      .container {
        padding-left: 13px;
        padding-right: 13px;
      }

      .card {
        padding: 18px;
      }

      .summary-box .number {
        font-size: 16px;
      }
    }
  </style>
</head>


<body>

<div class="container">

  <div class="header">
    <div class="icon">💍</div>
    <h1>축의대 관리</h1>
    <p>축의금 접수 및 식권 관리</p>
  </div>


  <!-- ========================= -->
  <!-- 접수 -->
  <!-- ========================= -->

  <div class="card">

    <span class="label">구분</span>

    <div class="side-buttons">

      <button
        type="button"
        class="side-button active"
        onclick="selectSide('신랑측', this)"
      >
        🤵 신랑측
      </button>

      <button
        type="button"
        class="side-button"
        onclick="selectSide('신부측', this)"
      >
        👰 신부측
      </button>

    </div>


    <span class="label">이름</span>

    <input
      id="name"
      type="text"
      placeholder="이름을 입력하세요"
      autocomplete="off"
    >


    <span class="label">축의금</span>

    <div class="amount-buttons">

      <button type="button" class="amount-button" onclick="setAmount(50000)">
        5만원
      </button>

      <button type="button" class="amount-button" onclick="setAmount(100000)">
        10만원
      </button>

      <button type="button" class="amount-button" onclick="setAmount(200000)">
        20만원
      </button>

      <button type="button" class="amount-button" onclick="setAmount(300000)">
        30만원
      </button>

      <button type="button" class="amount-button" onclick="setAmount(500000)">
        50만원
      </button>

      <button type="button" class="amount-button" onclick="setAmount(1000000)">
        100만원
      </button>

    </div>

    <input
      id="amount"
      type="number"
      placeholder="금액을 직접 입력하세요"
      min="0"
    >


    <span class="label">식권</span>

    <input
      id="meal"
      type="number"
      value="0"
      min="0"
      placeholder="식권 수량"
    >


    <span class="label">접수자</span>

    <input
      id="recorder"
      type="text"
      placeholder="접수자 이름"
      autocomplete="off"
    >


    <button
      type="button"
      id="submitButton"
      class="submit-button"
      onclick="submitGift()"
    >
      접수하기
    </button>

    <div id="status" class="status"></div>

  </div>


  <!-- ========================= -->
  <!-- 통계 -->
  <!-- ========================= -->

  <div class="summary">

    <div class="summary-box">
      <div class="number" id="count">-</div>
      <div class="title">총 접수</div>
    </div>

    <div class="summary-box">
      <div class="number" id="total">-</div>
      <div class="title">총 축의금</div>
    </div>

    <div class="summary-box">
      <div class="number" id="mealTotal">-</div>
      <div class="title">총 식권</div>
    </div>

  </div>


  <!-- ========================= -->
  <!-- 접수내역 -->
  <!-- ========================= -->

  <div class="card">

    <div class="list-header">

      <h2>📋 접수내역</h2>

      <button
        type="button"
        class="refresh-button"
        onclick="loadRecords()"
      >
        🔄 새로고침
      </button>

    </div>


    <input
      id="search"
      class="search"
      type="text"
      placeholder="🔎 이름 검색"
      oninput="renderRecords()"
    >


    <div class="filter-buttons">

      <button
        type="button"
        class="filter-button active"
        onclick="selectFilter('전체', this)"
      >
        전체
      </button>

      <button
        type="button"
        class="filter-button"
        onclick="selectFilter('신랑측', this)"
      >
        🤵 신랑측
      </button>

      <button
        type="button"
        class="filter-button"
        onclick="selectFilter('신부측', this)"
      >
        👰 신부측
      </button>

    </div>


    <div id="recordList">

      <div class="empty">
        불러오는 중...
      </div>

    </div>

  </div>


  <div class="notice">
    💐 축의대 접수 프로그램
  </div>

</div>


<script>

  /*
   * =====================================
   * Supabase
   * =====================================
   */

  const SUPABASE_URL =
    "https://snsschroqinfhqdopxyv.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_XURZS8NolmcPdWztVI5uzA_4ULYxiZI";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /*
   * =====================================
   * 상태값
   * =====================================
   */

  let selectedSide = "신랑측";

  let selectedFilter = "전체";

  let records = [];


  /*
   * =====================================
   * 신랑 / 신부 선택
   * =====================================
   */

  function selectSide(side, button) {

    selectedSide = side;

    document
      .querySelectorAll(".side-button")
      .forEach(function(btn) {
        btn.classList.remove("active");
      });

    button.classList.add("active");
  }


  /*
   * =====================================
   * 금액
   * =====================================
   */

  function setAmount(amount) {

    document.getElementById("amount").value =
      amount;
  }


  /*
   * =====================================
   * 축의금 저장
   * =====================================
   */

  async function submitGift() {

    const name =
      document
        .getElementById("name")
        .value
        .trim();

    const amount =
      Number(
        document.getElementById("amount").value
      );

    const meal =
      Number(
        document.getElementById("meal").value
      ) || 0;

    const recorder =
      document
        .getElementById("recorder")
        .value
        .trim();

    const status =
      document.getElementById("status");

    const button =
      document.getElementById("submitButton");


    if (!name) {

      alert("이름을 입력해주세요.");

      document
        .getElementById("name")
        .focus();

      return;
    }


    if (!amount || amount <= 0) {

      alert("축의금을 입력해주세요.");

      document
        .getElementById("amount")
        .focus();

      return;
    }


    button.disabled = true;

    button.textContent =
      "저장 중...";

    status.textContent = "";


    const result =
      await supabaseClient
        .from("gifts")
        .insert({
          side: selectedSide,
          name: name,
          amount: amount,
          meal_count: meal,
          recorder: recorder || null
        });


    if (result.error) {

      console.error(
        "Supabase 오류:",
        result.error
      );

      status.textContent =
        "❌ 저장 실패: " +
        result.error.message;

      alert(
        "저장에 실패했습니다.\n\n" +
        "오류 내용:\n" +
        result.error.message
      );


    } else {

      status.textContent =
        "✅ 접수가 완료되었습니다!";

      alert(
        name +
        "님 접수가 완료되었습니다!\n\n" +
        amount.toLocaleString() +
        "원 / 식권 " +
        meal +
        "장"
      );


      document.getElementById("name").value =
        "";

      document.getElementById("amount").value =
        "";

      document.getElementById("meal").value =
        "0";


      await loadRecords();
    }


    button.disabled = false;

    button.textContent =
      "접수하기";
  }


  /*
   * =====================================
   * DB에서 접수내역 불러오기
   * =====================================
   */

  async function loadRecords() {

    const list =
      document.getElementById("recordList");

    list.innerHTML =
      '<div class="empty">불러오는 중...</div>';


    const result =
      await supabaseClient
        .from("gifts")
        .select("*")
        .order("created_at", {
          ascending: false
        });


    if (result.error) {

      console.error(result.error);

      list.innerHTML =
        '<div class="empty">접수내역을 불러오지 못했습니다.</div>';

      return;
    }


    records =
      result.data || [];


    updateSummary();

    renderRecords();
  }


  /*
   * =====================================
   * 통계
   * =====================================
   */

  function updateSummary() {

    const count =
      records.length;


    const total =
      records.reduce(
        function(sum, item) {

          return (
            sum +
            Number(item.amount || 0)
          );

        },
        0
      );


    const mealTotal =
      records.reduce(
        function(sum, item) {

          return (
            sum +
            Number(item.meal_count || 0)
          );

        },
        0
      );


    document.getElementById("count").textContent =
      count.toLocaleString() +
      "명";


    document.getElementById("total").textContent =
      total.toLocaleString() +
      "원";


    document.getElementById("mealTotal").textContent =
      mealTotal.toLocaleString() +
      "장";
  }


  /*
   * =====================================
   * 필터 선택
   * =====================================
   */

  function selectFilter(filter, button) {

    selectedFilter = filter;

    document
      .querySelectorAll(".filter-button")
      .forEach(function(btn) {
        btn.classList.remove("active");
      });

    button.classList.add("active");

    renderRecords();
  }


  /*
   * =====================================
   * 접수내역 화면
   * =====================================
   */

  function renderRecords() {

    const list =
      document.getElementById("recordList");

    const search =
      document
        .getElementById("search")
        .value
        .trim()
        .toLowerCase();


    let filtered =
      records.filter(function(item) {

        const matchesSide =
          selectedFilter === "전체" ||
          item.side === selectedFilter;


        const matchesSearch =
          !search ||
          String(item.name || "")
            .toLowerCase()
            .includes(search);


        return (
          matchesSide &&
          matchesSearch
        );
      });


    if (filtered.length === 0) {

      list.innerHTML =
        '<div class="empty">접수내역이 없습니다.</div>';

      return;
    }


    list.innerHTML =
      filtered
        .map(function(item) {

          const side =
            item.side || "-";

          const name =
            item.name || "-";

          const amount =
            Number(item.amount || 0)
              .toLocaleString();

          const meal =
            Number(item.meal_count || 0);

          const recorder =
            item.recorder || "미입력";


          return `
            <div class="record">

              <div class="record-main">

                <div class="record-name">
                  ${escapeHtml(name)}
                </div>

                <div class="record-amount">
                  ${amount}원
                </div>

              </div>

              <div class="record-info">

                <span class="badge">
                  ${escapeHtml(side)}
                </span>

                <span>
                  🎫 식권 ${meal}장
                </span>

                <span>
                  👤 ${escapeHtml(recorder)}
                </span>

              </div>

            </div>
          `;

        })
        .join("");
  }


  /*
   * =====================================
   * HTML 문자 안전 처리
   * =====================================
   */

  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  /*
   * =====================================
   * 시작
   * =====================================
   */

  loadRecords();

</script>

</body>
</html>
