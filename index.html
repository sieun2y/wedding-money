<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>축의대 관리</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif;
      background: #f7f5f2;
      color: #333;
    }

    .container {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header .icon {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
    }

    .header p {
      margin-top: 8px;
      color: #888;
      font-size: 14px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 16px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.05);
    }

    .label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .side-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 22px;
    }

    .side-button {
      flex: 1;
      border: 1px solid #ddd;
      background: white;
      border-radius: 12px;
      padding: 13px;
      font-size: 15px;
      cursor: pointer;
    }

    .side-button.active {
      background: #333;
      color: white;
      border-color: #333;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      margin-bottom: 18px;
    }

    .amount-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .amount-button {
      padding: 11px 5px;
      border: 1px solid #ddd;
      background: white;
      border-radius: 10px;
      cursor: pointer;
    }

    .submit-button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 16px;
      background: #222;
      color: white;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
    }

    .submit-button:disabled {
      background: #aaa;
    }

    .summary {
      display: flex;
      gap: 10px;
    }

    .summary-box {
      flex: 1;
      background: white;
      border-radius: 16px;
      padding: 18px;
      text-align: center;
      box-shadow: 0 4px 18px rgba(0,0,0,0.04);
    }

    .summary-box .number {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .summary-box .title {
      font-size: 12px;
      color: #999;
    }

    .status {
      text-align: center;
      margin: 16px 0;
      font-size: 14px;
      min-height: 20px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="icon">💍</div>
    <h1>축의대 관리</h1>
    <p>축의금 접수 및 식권 관리</p>
  </div>

  <div class="card">

    <span class="label">구분</span>

    <div class="side-buttons">
      <button class="side-button active" onclick="selectSide('신랑측', this)">
        🤵 신랑측
      </button>

      <button class="side-button" onclick="selectSide('신부측', this)">
        👰 신부측
      </button>
    </div>

    <span class="label">이름</span>
    <input id="name" type="text" placeholder="이름을 입력하세요">

    <span class="label">축의금</span>

    <div class="amount-buttons">
      <button class="amount-button" onclick="setAmount(50000)">5만원</button>
      <button class="amount-button" onclick="setAmount(100000)">10만원</button>
      <button class="amount-button" onclick="setAmount(200000)">20만원</button>
      <button class="amount-button" onclick="setAmount(300000)">30만원</button>
      <button class="amount-button" onclick="setAmount(500000)">50만원</button>
      <button class="amount-button" onclick="setAmount(1000000)">100만원</button>
    </div>

    <input
      id="amount"
      type="number"
      placeholder="금액을 직접 입력하세요"
    >

    <span class="label">식권</span>
    <input
      id="meal"
      type="number"
      value="0"
      min="0"
      placeholder="식권 수량"
    >

    <span class="label">접수자</span>
    <input
      id="recorder"
      type="text"
      placeholder="접수자 이름"
    >

    <button id="submitButton" class="submit-button" onclick="submitGift()">
      접수하기
    </button>

    <div id="status" class="status"></div>

  </div>

  <div class="summary">

    <div class="summary-box">
      <div class="number" id="count">-</div>
      <div class="title">총 접수</div>
    </div>

    <div class="summary-box">
      <div class="number" id="total">-</div>
      <div class="title">현재 총액</div>
    </div>

  </div>

</div>

<script>

  // ==============================
  // 🔐 Supabase 연결 정보
  // ==============================

  const SUPABASE_URL = "https://snsschroqinfhqdopxyv.supabase.co/rest/v1/";
  const SUPABASE_KEY = "sb_publishable_XURZS8NolmcPdWztVI5uzA_4ULYxiZI";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


  // ==============================
  // 신랑측 / 신부측
  // ==============================

  let selectedSide = "신랑측";

  function selectSide(side, button) {

    selectedSide = side;

    document.querySelectorAll(".side-button")
      .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");
  }


  // ==============================
  // 금액 버튼
  // ==============================

  function setAmount(amount) {
    document.getElementById("amount").value = amount;
  }


  // ==============================
  // 축의금 저장
  // ==============================

  async function submitGift() {

    const name =
      document.getElementById("name").value.trim();

    const amount =
      Number(document.getElementById("amount").value);

    const meal =
      Number(document.getElementById("meal").value);

    const recorder =
      document.getElementById("recorder").value.trim();

    const status =
      document.getElementById("status");

    const button =
      document.getElementById("submitButton");


    if (!name) {
      alert("이름을 입력해주세요.");
      return;
    }

    if (!amount || amount <= 0) {
      alert("축의금을 입력해주세요.");
      return;
    }


    button.disabled = true;
    button.textContent = "저장 중...";
    status.textContent = "";


    const { error } = await supabaseClient
      .from("gifts")
      .insert({
        side: selectedSide,
        name: name,
        amount: amount,
        meal_count: meal || 0,
        recorder: recorder || null
      });


   if (error) {

  console.error("Supabase 오류:", error);

  status.textContent =
    "❌ " + error.message;

  alert(
    "저장 실패\n\n" +
    "오류: " + error.message
  );

} else {

  status.textContent =
    "✅ 접수가 완료되었습니다!";

  alert(
    `${name}님 접수가 완료되었습니다!\n` +
    `${amount.toLocaleString()}원 / 식권 ${meal || 0}장`
  );

  document.getElementById("name").value = "";
  document.getElementById("amount").value = "";
  document.getElementById("meal").value = "0";

  await loadSummary();
} else {

      status.textContent =
        "✅ 접수가 완료되었습니다!";

      alert(
        `${name}님 접수가 완료되었습니다!\n` +
        `${amount.toLocaleString()}원 / 식권 ${meal || 0}장`
      );

      document.getElementById("name").value = "";
      document.getElementById("amount").value = "";
      document.getElementById("meal").value = "0";

      await loadSummary();
    }


    button.disabled = false;
    button.textContent = "접수하기";
  }


  // ==============================
  // 총 접수 / 총액
  // ==============================

  async function loadSummary() {

    const { data, error } = await supabaseClient
      .from("gifts")
      .select("amount");

    if (error) {
      console.error(error);
      return;
    }

    const count = data.length;

    const total = data.reduce(
      (sum, item) => sum + Number(item.amount || 0),
      0
    );

    document.getElementById("count").textContent =
      count.toLocaleString() + "명";

    document.getElementById("total").textContent =
      total.toLocaleString() + "원";
  }


  // ==============================
  // 처음 실행
  // ==============================

  loadSummary();

</script>

</body>
</html>
